spring:
  application:
    name: agent-gateway
  main:
    banner-mode: "off"

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{conversationId}] %-5level %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8082}

openai:
  api-key: ${OPENAI_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

llm:
  mockEnabled: ${LLM_MOCK_ENABLED:true}
